# OB1 RADAR - Configurazione algoritmo di discovery
# Unico posto dove si toccano i pesi/soglie/fonti senza toccare codice.
# Aggiornato: 2026-07-01

# --- Piramide delle fonti (grafo osservazioni) ----------------------------
# Ogni fonte ha un LIVELLO: in basso l'occhio umano e la nicchia locale
# (fresco, vicino al campo, rumoroso), in alto i dati strutturati globali
# (consolidati ma in ritardo - audit live 2026-07: mediana 24gg dall'ultima
# modifica scheda Wikidata, p75 = 120gg, e il club P54 resta "aperto" anche
# dopo un trasferimento gia' sulla stampa).
#
# REGOLA D'INVERSIONE (regole_campo): la piramide non si legge sempre nello
# stesso verso. I fatti VELOCI (club attuale) si leggono DAL BASSO: un
# articolo datato batte un claim Wikidata senza data. I fatti LENTI (data di
# nascita) DALL'ALTO: sull'anagrafica l'archivio consolidato batte il
# giornale. L'osservazione fonte=umano (livello 0) batte tutto, sempre.
piramide:
  livelli:
    umano: 0            # il tuo tap sulla card - L0, il campo per procura
    news: 2             # stampa via ricerca web (la piu' fresca che abbiamo)
    wikipedia_torneo: 3 # pagine-rosa dei tornei: congelate alla data del torneo
    wikidata: 4         # spina dorsale per l'identita', lenta sul presente
  regole_campo:
    club: dal_basso     # fatto veloce
    dob: dall_alto      # fatto lento (pronto per la fase 4, non ancora usato)
  # finche' due fonti sono in disaccordo sul club, la query buzz cerca con
  # ENTRAMBI i nomi (vedi buzz_score) - cosi' il trasferimento non acceca il
  # radar nel momento esatto del salto
  finestra_transizione_giorni: 45

# --- Universo dei candidati ---------------------------------------------
# Ogni "biblioteca" ha un'indicizzazione diversa - usare la stessa strategia
# di ricerca ovunque produce falsi negativi sistematici, non perche' i dati
# non ci siano ma perche' si cerca con l'approccio sbagliato per quel
# contesto. Tre meccanismi diversi, ciascuno verificato live prima di essere
# scritto (non per ipotesi):
# - Leghe pro (IT B/C/D + 2a/3a di PT/FR/ES/NL/DE): ricerca PER LEGA -
#   Wikidata ha rose strutturate interrogabili via SPARQL (club "in lega"
#   P118 + membership P54 corrente). Una voce qui = una query, zero codice.
# - Giovanili sudamericane: Wikidata NON ha dati strutturati per le rose dei
#   tornei CONMEBOL (verificato: la pagina Wikidata e' solo un placeholder
#   senza claim utili). I dati veri stanno nel testo della pagina Wikipedia
#   corrispondente, in un formato a template regex-estraibile.
# - Pool per cittadinanza: ricerca PER NAZIONALITA', indipendente da dove il
#   giocatore gioca ora (query completamente diversa dalla ricerca per lega -
#   serve quando la domanda e' "chi e' portoghese/eleggibile", non "chi gioca
#   nel campionato portoghese"). ATTENZIONE verificata live: senza il filtro
#   di genere (P21) la query restituisce quasi solo calciatrici donne per
#   questo taglio d'eta' - il filtro genere e' obbligatorio, non opzionale.
#   Molti risultati non hanno un club corrente risolvibile su Wikidata
#   (verificato: 23 su 30 nel test Portogallo) - normale per questa
#   "biblioteca", non un errore: restano candidati validi con dati parziali.
