# --- Layer A: eta' di riferimento per tier di competizione ---------------
# Non "il piu' giovane", ma "giovane rispetto al livello che sta gia' reggendo".
# reference_age = eta' MEDIA REALE dei candidati attualmente in pool per quel
# tier (calcolata dal vivo il 2026-07-01, non stimata a sensazione - i valori
# precedenti erano un punto di partenza dichiarato non validato, si e' visto
# che erano sbagliati anche di 5-6 anni). spread_years = deviazione standard
# reale della stessa popolazione: satura il punteggio a 1.0 per chi e' circa
# 1 deviazione standard sotto la media, non premia all'infinito un'eta'
# improbabile. Da ricalcolare periodicamente (le rose cambiano stagione per
# stagione) rifacendo il calcolo su fetch_serie_players()/fetch_conmebol_squads()
# /fetch_nationality_players() - non serve un tool nuovo, sono dati che gia'
# arriviamo a scaricare ogni "Aggiorna".
#
# ATTENZIONE CAMPIONI PICCOLI: serie_d (n=5) e serie_c_riserve (n=7) sono
# calcolati su pochissimi candidati - trattarli come provvisori, non come
# verita' assodata, finche' il pool non cresce con altri run.
# Le leghe aggiunte 2026-08 (Serie B + 2a/3a estere) partono con placeholder
# allineati a C/D: ricalcolare al primo diagnose/refresh con copertura reale.
age_reference:
  serie_b:
    # placeholder - ricalcolare al primo run con pool B reale
    reference_age: 23.5
    spread_years: 1.5
  serie_c:
    # n=19, media 23.0, std 1.27
    reference_age: 23.0
    spread_years: 1.3
  serie_d:
    # n=5 - CAMPIONE MOLTO PICCOLO, provvisorio
    reference_age: 23.3
    spread_years: 1.2
  # Squadre riserve/Next Gen (rilevate live via Wikidata: classe "reserve
  # team" Q2412834, non solo per nome - verificato che "Juventus Next Gen"
  # e' l'unica in Serie C al momento, ma il meccanismo regge se ne arrivano
  # altre, es. Atalanta U23). La correzione principale per questo tier e'
  # nel peso (vedi signal_score_weights sotto): in queste squadre "giovane"
  # e' un requisito di regolamento (obbligo U21), non un segnale raro.
  serie_b_riserve:
    reference_age: 21.5
    spread_years: 2.0
  serie_c_riserve:
    # n=7 - CAMPIONE PICCOLO, provvisorio
    reference_age: 22.0
    spread_years: 2.5
  serie_d_riserve:
    # n=0: nessuna squadra riserve gioca in Serie D al momento (verificato
    # dal vivo) - valori ereditati da serie_d come placeholder, da ricalcolare
    # se/quando una squadra riserve compare li'.
    reference_age: 23.3
    spread_years: 1.2
  # 2a/3a estere: placeholder (stesso ordine di grandezza di C/D). Senza
  # age_reference il Layer A eta' torna None per quel tier (dato mancante,
  # non zero inventato) - meglio un punto di partenza esplicito e ricalcolo.
  portugal_2:
    reference_age: 23.0
    spread_years: 1.5
  portugal_3:
    reference_age: 22.5
    spread_years: 1.5
  france_2:
    reference_age: 23.0
    spread_years: 1.5
  france_3:
    reference_age: 22.5
    spread_years: 1.5
  spain_2:
    reference_age: 23.0
    spread_years: 1.5
  spain_3:
    reference_age: 22.5
    spread_years: 1.5
  netherlands_2:
    reference_age: 22.5
    spread_years: 1.5
  netherlands_3:
    reference_age: 22.0
    spread_years: 1.5
  germany_2:
    reference_age: 23.0
    spread_years: 1.5
  germany_3:
    reference_age: 22.5
    spread_years: 1.5
  conmebol_u20:
    # n=227, media 20.6, std 0.78 - campione solido
    reference_age: 20.6
    spread_years: 0.8
  conmebol_u17:
    # n=228, media 18.0, std 0.44 - campione solido, finestra stretta perche'
    # il regolamento del torneo vincola gia' l'eta' entro un intervallo piccolo
    reference_age: 18.0
    spread_years: 0.5
  nationality_pool:
    # n=3398, media 22.3, std 1.70 - campione solido
    reference_age: 22.3
    spread_years: 1.7

# --- Layer A: pesi del Signal Score, per tier -----------------------------
# "default" vale per tutti i tier non elencati esplicitamente. 50/50 e' un
# punto di partenza dichiarato, NON un valore validato: con solo due
# componenti liberamente disponibili non c'e' ancora evidenza per pesarle
# diversamente in generale. Vanno corrette quando radar_feed.json avra'
# abbastanza storico per un riscontro reale (vedi "verifica nel tempo").
#
# Eccezione gia' motivata da un caso reale (prima run swarm, verdetto del
# Giudice su Esad Deniz/Juventus Next Gen): nelle squadre riserve l'eta'
# bassa e' un requisito di regolamento (obbligo U21), quindi da sola non
# distingue nessuno - il buzz esterno (qualcuno ne parla anche se "tutti
# sono giovani per obbligo") resta l'unico segnale che dice qualcosa.
signal_score_weights:
  default:
    age_vs_level: 0.5
    buzz: 0.5
  serie_b_riserve:
    age_vs_level: 0.15
    buzz: 0.85
  serie_c_riserve:
    age_vs_level: 0.15
    buzz: 0.85
  serie_d_riserve:
    age_vs_level: 0.15
    buzz: 0.85

# --- Layer A: sotto-pesi del Buzz Score -----------------------------------
buzz_weights:
  velocity: 0.4
  niche_source_tier: 0.35
  geographic_crossing: 0.25
  # oltre questo numero di menzioni totali, il giocatore e' considerato
  # "gia' mainstream" e il buzz viene penalizzato invece che premiato
  mainstream_mention_threshold: 30

# Tier delle fonti per il segnale "niche_source_tier".
# NOTA: Google News RSS restituisce link di redirect (news.google.com/...),
# non l'URL reale della testata (verificato live) - quindi la classificazione
# si fa sul NOME della testata, che Google News mette in coda al titolo
# ("Headline - Nome Testata"), non sul dominio dell'URL.
# Tier 3 = stampa locale/di nicchia (bonus alto), Tier 1 = testate big
# (una volta che parlano loro, il vantaggio e' gia' sfumato).
source_tiers:
  tier_1:
    - "Gazzetta dello Sport"
    - "Corriere dello Sport"
    - "Sky Sport"
    - "ESPN"
    - "BBC"
    - "Goal.com"
    - "Tuttosport"
  tier_2:
    - "TuttoMercatoWeb"
    - "Calciomercato.com"
    - "Tuttocalciatori"
    - "Transfermarkt"
  # tutto il resto (stampa locale/regionale, siti di club, testate estere
  # minori) e' trattato come tier 3 di default: e' li' che nasce il segnale.

# --- Layer B: profili contestuali (Fit Score) -----------------------------
# Nessun modello: solo filtri booleani + moltiplicatori applicati al
# Signal Score. Selezionabili come chip rapidi in UI.
# max_tier: IT B/C/D (+ riserve) + 2a/3a PT/FR/ES/NL/DE. CONMEBOL youth +
# nationality_pool solo sui profili di scoperta ampia (non su "Rosa Serie C").
purpose_profiles:
  resale_value:
    label: "Rivendita"
    description: "Punta sull'upside: eta' relativa e velocita' del buzz contano di piu'."
    weight_multipliers:
      age_vs_level: 1.3
      buzz: 1.2
    max_tier:
      [serie_b, serie_c, serie_d, serie_b_riserve, serie_c_riserve, serie_d_riserve,
       portugal_2, portugal_3, france_2, france_3, spain_2, spain_3,
       netherlands_2, netherlands_3, germany_2, germany_3,
       conmebol_u20, conmebol_u17, nationality_pool]

  first_team_need:
    label: "Rosa Serie C"
    description: "Punta su conferme piu' solide, sconta l'hype puro del buzz. Bacino: leghe pro IT + 2a/3a europee (no pool nazionalita' sparsa)."
    weight_multipliers:
      age_vs_level: 1.0
      buzz: 0.7
    # esclude nationality_pool e CONMEBOL youth: qui serve chi gioca gia'
    # in un campionato pro/semi-pro "da rosa", non un pool sparso o U17
    max_tier:
      [serie_b, serie_c, serie_d, serie_b_riserve, serie_c_riserve, serie_d_riserve,
       portugal_2, portugal_3, france_2, france_3, spain_2, spain_3,
       netherlands_2, netherlands_3, germany_2, germany_3]

  tactical_profile:
    label: "Profilo tattico"
    description: "Nessun bonus/malus di score, solo filtro per ruolo."
    weight_multipliers:
      age_vs_level: 1.0
      buzz: 1.0
    max_tier:
      [serie_b, serie_c, serie_d, serie_b_riserve, serie_c_riserve, serie_d_riserve,
       portugal_2, portugal_3, france_2, france_3, spain_2, spain_3,
       netherlands_2, netherlands_3, germany_2, germany_3,
       conmebol_u20, conmebol_u17, nationality_pool]

# --- Swarm dossier ----------------------------------------------------------
swarm:
  # GATE SUL CAMBIAMENTO DI STATO (default dal 2026-08).
  # true  = il dossier si spende solo su chi la sonda senza AI ha segnalato
  #         come CAMBIATO in questo giro (decollo imminente, finestra
  #         precoce, salto anomalo, deriva sostenuta, dati completati, nuovo
  #         ingresso). Il costo AI diventa proporzionale agli EVENTI, non
  #         alla dimensione della pool: e' cio' che permette alla pool di
  #         crescere senza che cresca la spesa.
  # false = comportamento storico, i primi top_n della classifica.
  # Vedi ARCHITETTURA_PRODUZIONE.md §2 leva A.
  require_state_change: true
  # Tetto di spesa per giro, sempre applicato quando il gate e' attivo.
  # NON e' ridondante rispetto al gate: al primo run di un candidato la
  # sonda risponde "nuovo ingresso" per tutti, quindi su una pool fredda
  # senza tetto si brucerebbe l'intera quota giornaliera in una scansione.
  max_dossiers_per_run: 8
  # usato solo con require_state_change: false.
  # misurato dal vivo in produzione: 15 candidati sequenziali x 4 chiamate
  # AI ciascuno hanno superato i 9 minuti senza finire (503 da Cloud Run).
  # Abbassato a 8 e parallelizzato (swarm_workers) per stare comodi entro
  # il timeout del servizio.
  top_n_candidates_for_swarm: 8
  # Grounding del club via server tool openrouter:web_search.
  # false (default dal 2026-08): il club arriva dal GRAFO DELLE FONTI, letto
  # dai titoli stampa che il buzz check scarica comunque (news_reader) -
  # deterministico, gratuito, datato e con URL. Il vecchio percorso e'
  # fatturato a parte anche sui modelli ":free" (~$0.005 a richiesta) ed e'
  # limitato a 50 richieste/giorno sul tier free OpenRouter: era la prima
  # funzione a spegnersi sotto carico. Vedi ARCHITETTURA_PRODUZIONE.md §3.
  web_search_grounding: false
  # dossier in parallelo per candidato (ogni dossier resta 4 chiamate
  # sequenziali al suo interno, serve coerenza tra i 4 ruoli - solo i
  # candidati diversi tra loro corrono in parallelo). Tenuto basso per non
  # sommare troppe richieste/minuto sullo stesso provider (soprattutto
  # Gemini free tier, quota per-minuto piu' stretta di quanto sembri dal
  # limite giornaliero).
  swarm_workers: 3
  # rigira il dossier solo se il Signal Score e' cambiato di almeno questa
  # soglia dall'ultimo dossier salvato, per non sprecare quota OpenRouter
  # ripremendo "Aggiorna" piu' volte al giorno sugli stessi candidati.
  rerun_threshold_points: 8

# --- Performance ------------------------------------------------------------
# La pool candidati e' nell'ordine delle centinaia/migliaia (leghe IT+EU + CONMEBOL + nationality).
# Il controllo buzz fa una chiamata di rete per candidato: farlo su tutti a
# ogni "Aggiorna" significherebbe minuti di attesa da telefono. Si pre-filtra
# per eta'-relativa-al-livello (gratis, zero rete) e si controlla il buzz
# solo sul sottoinsieme piu' promettente, in parallelo.
performance:
  buzz_check_pool_size: 60
  buzz_check_workers: 8

# --- Stima bayesiana (Layer C) -----------------------------------------------
# Il Signal Score di un singolo run e' un punto, rumoroso: dipende da quali
# fonti hanno risposto quella volta (buzz specialmente). Qui NON si prevede
# il futuro (servirebbero esiti reali verificati, che non abbiamo ancora,
# vedi radar_feed history) - si stima solo il "livello vero" attuale del
# segnale filtrando il rumore tra le osservazioni ripetute nel tempo
# (filtro alla Kalman, 1 dimensione). Converge verso il punteggio quando le
# run sono ripetute e coerenti; resta incerto (banda larga) su un candidato
# visto una volta sola o con dati parziali.
bayesian:
  prior_variance: 400          # incertezza iniziale, prima osservazione (std=20 punti)
  process_variance: 25         # quanto puo' "muoversi" il livello vero tra due run (std=5 punti)
  observation_variance_full: 25      # rumore atteso di un'osservazione con dati completi (std=5)
  observation_variance_partial: 100  # rumore atteso con dati parziali (std=10) - meno fidata

# --- Sonda di cambiamento di stato (IL TURNO) --------------------------------
# Decide chi entra nel turno di revisione e chi resta silenzioso in archivio.
# Due tecniche consolidate (non inventate qui, solo combinate per questo
# dominio - vedi ricerca): l'innovazione del filtro di Kalman gia' sopra
# (quanto la nuova osservazione ha sorpreso il modello, in deviazioni
# standard - regola dei 3-sigma standard in anomaly detection) per gli shock
# singoli, e un CUSUM a due code per la deriva lenta ma sostenuta che nessun
# singolo salto giustificherebbe da solo (stesso principio delle carte di
# controllo industriali). Applicata solo ai candidati che arrivano al
# dossier (lo stesso sottoinsieme stretto del funnel, mai sull'intera pool).
state_change:
  shock_z_threshold: 2.5   # |z| oltre questa soglia = salto statisticamente vero, non rumore
  cusum_k: 0.5             # allowance/slack: quanto puo' muoversi senza accumulare
  cusum_threshold: 4.0     # soglia di allarme sulla somma cumulativa
  # "finestra precoce" (early adopter): buzz_score gia' calcola queste
  # componenti (discovery_engine.buzz_score) ma le fondeva in un unico
  # numero, perdendo il segnale piu' anticipatorio che il sistema ha - qui
  # vengono estratte come stato a se'. early_velocity_threshold e' sulla
  # sub-score "velocity" (0-1, gia' normalizzata: 1.0 = +5 menzioni sul
  # giro precedente) - 0.4 equivale a un salto di almeno 2 menzioni.
  early_velocity_threshold: 0.4

# --- Layer E: LA CURVA - posizione sulla curva di adozione -------------------
# Lo scopo dichiarato del radar: trovare il giocatore mentre e' ANCORA nella
# fase early adopter ma sta per uscirne - il momento in cui piu' fattori
# oggettivi convergono e indicano che visibilita' e concorrenza stanno per
# salire. Base teorica consolidata, non inventata qui: curve di diffusione
# a S (Rogers/Bass - la fase di massima accelerazione precede il punto di
# flesso) e "two-step flow" (l'informazione scala da fonti di nicchia a
# testate generaliste, un gradino per volta - la scalata dei tier E' il
# segnale che il crossing si avvicina).
#
# Fasi (classificazione esplicita, regole ispezionabili, zero ML):
#   0 invisibile        nessuna menzione
#   1 nicchia           menzioni sporadiche, solo fonti tier-3
#   2 fermento          presenza continua nelle fonti di nicchia
#   3 decollo imminente >= takeoff_min_factors fattori attivi, ancora zero
#                       tier-1 -> IL segnale per cui esiste il prodotto
#   4 crossing          prima fonte tier-1 in assoluto (finestra chiusa ORA)
#   5 mainstream        tier-1 gia' presente in run precedenti (troppo tardi)
#
# LIMITE ONESTO dichiarato: i run avvengono solo quando si preme "cerca
# aggiornamenti", a intervalli irregolari - quindi "accelerazione" e'
# misurata per-controllo, non per-giorno, e NESSUNA stima temporale ("croce
# tra 2 settimane") sarebbe onesta. Inoltre mention_count satura a 8
# (max_results della query news): oltre quella soglia la crescita non e'
# piu' misurabile e il fattore accelerazione resta muto, non inventato.
adoption_curve:
  min_runs_for_assessment: 3   # sotto questa storia: "storico insufficiente", mai una fase stimata
  takeoff_min_factors: 3       # quanti fattori (su 4) devono convergere per la fase 3
  persistence_min_runs: 3      # menzioni presenti in N controlli consecutivi = presenza vera, non spike
  tier_climb_recent_window: 2  # la prima fonte tier-2 conta come "scalata" se comparsa negli ultimi N run
  # peso di ogni fattore nella "pressione di uscita" (0-100). La somma fa
  # 100. Punto di partenza dichiarato, da correggere quando il registro di
  # validazione retroattiva (curve_validation.json) avra' abbastanza casi.
  factor_weights:
    accelerazione: 30        # crescita delle menzioni che non rallenta (firma pre-flesso della curva a S)
    scalata_tier: 30         # prima testata tier-2 dopo run di sola nicchia (two-step flow in azione)
    allargamento_fonti: 20   # piu' testate DISTINTE di quante mai viste prima (adozione indipendente, non un blog che insiste)
    persistenza: 20          # presente da N controlli consecutivi (gli spike decadono, l'adozione persiste)

# --- Layer F: VALIDAZIONE TECNICA (il segnale costoso) -----------------------
# LA LACUNA CHE QUESTO BLOCCO CHIUDE. Fino al Layer E il radar misura una cosa
# sola: l'ATTENZIONE (chi ne parla, quanto, da che tier). E' il segnale piu'
# anticipatorio che esiste a costo zero, ma ha un difetto strutturale
# dichiarato nel README: scrivere un articolo NON COSTA NULLA. Chiunque puo'
# emetterlo - un procuratore, un ufficio stampa, un blog compiacente. Un radar
# che ascolta solo quel canale e' per costruzione aggirabile.
#
# LA TESI: esiste una classe di segnali GRATIS DA LEGGERE ma COSTOSI DA
# EMETTERE, e nessuno la stava leggendo.
#   - Un allenatore che manda in campo un 17enne in una lega professionistica
#     ci mette punti, classifica e, alla lunga, il posto di lavoro.
#   - Una federazione che lo convoca spende uno slot di rosa conteso, ED E' UN
#     VALUTATORE INDIPENDENTE DAL CLUB (il club ha interesse a gonfiare il
#     proprio asset, la federazione no).
#   - Un club che lo compra da una categoria inferiore ci mette soldi.
# Nessuno di questi atti e' falsificabile dall'entourage del giocatore. Sono
# scommesse con la pelle in gioco (Spence 1973 sul signaling costoso; Zahavi
# 1975 sull'handicap - base teorica consolidata, non inventata qui).
#
# COSA MISURA (e cosa NO). NON misura quanto e' bravo: per quello servono dati
# evento che a questo livello non esistono gratis, e il README lo dice. Misura
# QUANTO QUALCUNO CHE RISCHIAVA QUALCOSA HA GIA' PUNTATO SU DI LUI. E' il
# complemento onesto del buzz, non un suo sostituto: vive su un asse SEPARATO
# (vedi quadranti) proprio per non confondersi con esso.
#
# NOTA DI PARENTELA CON IL LAYER A: il Layer A calcola gia' "giovane per il
# suo livello", ma li' il livello e' la PRESENZA IN ROSA, che costa quasi
# nulla. Qui si calcola la stessa idea dove il livello e' CIO' CHE QUALCUNO HA
# davvero RISCHIATO. Stessa intuizione, segnale molto piu' caro da falsificare.
validazione_tecnica:
  attiva: true

  # REGOLA CARDINALE - MONOTONIA: la validazione puo' solo CONFERMARE, mai
  # CONDANNARE. Le fonti libere sono incomplete per costruzione (audit README:
  # 52% dei QID senza club su Wikidata): l'assenza di un dato NON e' prova
  # dell'assenza del fatto. Quindi un componente entra nel calcolo SOLO con
  # evidenza positiva; non esistono zeri "per dato mancante". Conseguenza
  # verificata da test: aggiungere un record non puo' MAI abbassare il
  # punteggio. E' cio' che rende il layer sicuro su dati radi.
  #
  # Da qui anche la scelta di combinare i componenti in noisy-OR invece che
  # con la media pesata del Layer A: li' i componenti sono due viste dello
  # STESSO fenomeno latente (l'attenzione) e la media ha senso; qui ogni
  # segnale costoso e' una conferma INDIPENDENTE, e non averne uno non e'
  # un voto contro. La media violerebbe la monotonia (aggiungere un
  # componente basso abbasserebbe il totale); il noisy-OR no, mai.
  combinazione: noisy_or

  # Peso di ciascun componente nel noisy-OR (0-1): quanto un singolo segnale
  # saturo puo' da solo portare in alto il punteggio. Ordinati per COSTO
  # DELL'ATTO, che e' l'unica gerarchia difendibile qui.
  pesi:
    selezione_esterna: 0.85   # convocazione in nazionale: valutatore indipendente dal club
    fiducia_guadagnata: 0.80  # minuti veri in prima squadra: l'allenatore ci mette la panchina
    traiettoria: 0.45         # salto verso l'alto: qualcuno ha pagato per portarlo su

  # Costo relativo dell'atto, per la UI e per il /processo: quanto e' CARO
  # emettere questo segnale, cioe' quanto e' difficile falsificarlo. La
  # menzione stampa e' qui a 0.0 non per dispetto ma per dichiarare
  # l'invariante: cio' che il buzz gia' misura NON entra mai nella
  # validazione, altrimenti si conterebbe due volte lo stesso bit.
  costo_segnale:
    convocazione_nazionale: 1.0
    presenze_prima_squadra: 0.9
    trasferimento_verso_alto: 0.7
    presenza_in_rosa: 0.2      # esserci e basta costa poco: non valida nulla da solo
    menzione_stampa: 0.0       # <- gia' misurata dal buzz, esclusa per costruzione

  # Bande di livello competitivo. peso = quanto vale un minuto giocato li';
  # eta_riferimento = eta' tipica di un titolare in quella banda, usata per la
  # PRECOCITA' (stessa logica di age_reference del Layer A, applicata pero'
  # ai minuti veri invece che alla presenza in rosa).
  # TARATURA - perche' la scala e' COMPRESSA e non lineare sulla piramide
  # calcistica. Errore commesso e corretto in fase di sviluppo: con pesi
  # "realistici" (Serie C a 0.45) una STAGIONE INTERA di un 17enne in Serie C
  # arrivava a 36/100 e non superava soglia_validazione - cioe' il caso
  # centrale del radar risultava "non validato". Il difetto era concettuale,
  # non numerico: questi pesi non misurano quanto e' forte il campionato, ma
  # QUANTO COSTA A CHI DECIDE mandarlo in campo - e un allenatore di Serie D
  # che schiera un 17enne rischia il proprio posto esattamente come uno di
  # Serie A. Il livello modula (dice fin dove puo' arrivare), non schiaccia.
  # Con questa scala la stessa stagione vale 56/100: validato, come dev'essere.
  livelli:
    prima_divisione_top:  {peso: 1.00, eta_riferimento: 25.0}
    prima_divisione:      {peso: 0.92, eta_riferimento: 24.5}
    seconda_divisione:    {peso: 0.82, eta_riferimento: 24.0}
    terza_divisione:      {peso: 0.70, eta_riferimento: 23.0}
    quarta_divisione:     {peso: 0.55, eta_riferimento: 23.0}
    riserve_giovanili:    {peso: 0.35, eta_riferimento: 20.0}

  # QID lega -> banda. TUTTI verificati uno per uno via API MediaWiki prima di
  # essere scritti qui (l'endpoint wbgetentities, che non e' WDQS e regge
  # anche durante gli outage del query service). La verifica non e' stata
  # cerimoniale: ha intercettato due QID sbagliati presi a memoria - Q201620
  # e' "valdismo" (un movimento cristiano medievale) non l'Eredivisie, e
  # Q178874 e' la "corona slovacca" non la Primeira Liga. Stessa trappola su
  # Q2164956, che e' l'Eredivisie DI HOCKEY SU GHIACCIO. Una lega non elencata
  # qui non vale zero: vale "livello ignoto" e viene gestita come dato
  # mancante (vedi presenze_livello_ignoto nella copertura).
  competizioni:
    Q15804: prima_divisione_top      # Serie A
    Q9448: prima_divisione_top       # Premier League
    Q324867: prima_divisione_top     # LaLiga
    Q82595: prima_divisione_top      # Fussball-Bundesliga
    Q13394: prima_divisione_top      # Ligue 1
    Q167541: prima_divisione         # Eredivisie (calcio - NON Q2164956, che e' hockey)
    Q182994: prima_divisione         # Liga Portugal (NON Q21929716, che e' la Primeira Liga BRASILIANA)
    Q194052: seconda_divisione       # Serie B
    Q152665: seconda_divisione       # 2. Fussball-Bundesliga
    Q217374: seconda_divisione       # Ligue 2
    Q35615: seconda_divisione        # Segunda Division
    Q754488: seconda_divisione       # Liga Portugal 2
    Q610823: seconda_divisione       # Eerste Divisie
    Q607965: terza_divisione         # Serie C
    Q154069: terza_divisione         # 3. Liga
    Q864298: terza_divisione         # Ligue 3 (Championnat National)
    Q100146559: terza_divisione      # Primera Federacion
    Q106597664: terza_divisione      # Terceira Liga
    Q2777436: terza_divisione        # Tweede Divisie
    Q1141778: quarta_divisione       # Serie D
    # Aggiunte dopo la prova live: la Superliga danese e' comparsa nei dati
    # veri di un candidato (una presenza in prima squadra che, non essendo
    # mappata, era finita in "livello ignoto" senza poter pesare). E' il modo
    # in cui questa mappa va estesa: guardando cosa esce davvero dal feed, non
    # provando a indovinare in anticipo tutte le leghe del mondo.
    Q204752: prima_divisione         # Superliga danese
    Q216022: prima_divisione         # Belgian Pro League
    Q219592: prima_divisione         # Bundesliga austriaca
    Q202699: prima_divisione         # Swiss Super League
    Q14377162: prima_divisione       # Scottish Premiership (calcio - l'omonimo Q2261131 e' RUGBY)
    Q485568: prima_divisione         # Super Lig turca (NON Q2180367, che e' quella di Cipro Nord)
    Q235114: prima_divisione         # Super League Greece
    Q63980269: seconda_divisione     # Super League Greece 2
    Q44763: prima_divisione          # Ekstraklasa (calcio - Q1345484 e' pallamano, Q2300526 hockey)
    Q217016: prima_divisione         # Czech First League
    Q201671: prima_divisione         # Eliteserien norvegese (CALCIO - Q1421206 e' hockey, Q3430157 bandy)
    Q19510: seconda_divisione        # EFL Championship (2a inglese: stessa banda di Serie B/Ligue 2/2.Bundesliga)
    Q162604: prima_divisione         # Croatian Football League
    Q235307: prima_divisione         # Serbian SuperLiga
    Q202243: prima_divisione         # Allsvenskan (CALCIO - esistono omonime di bandy Q502828,
                                     #   pallamano Q2649473 e floorball Q10406371)
    # Fuori Europa: servono ai pool per cittadinanza (Giappone, Corea, Messico,
    # USA, Africa), dove il candidato spesso gioca in patria e non in Europa.
    # Stanno in "prima_divisione" perche' SONO prime divisioni: la scala qui
    # misura quanto costa a chi decide, non la forza del campionato (vedi la
    # nota sulla taratura sopra). Se un domani serve piu' granularita', si
    # aggiunge una banda in "livelli" senza toccare una riga di codice.
    Q206813: prima_divisione         # Campeonato Brasileiro Serie A
    Q18543: prima_divisione          # Major League Soccer
    Q764690: prima_divisione         # Liga MX (NON Q29613430, che e' la Liga MX Femenil)
    Q2386334: prima_divisione        # K League 1 (Corea del Sud)
    Q276445: prima_divisione         # J1 League (Giappone - il pool per cittadinanza piu' grande)
    Q794235: prima_divisione         # Ligue Professionnelle 1 tunisina
    Q647746: prima_divisione         # Ligue Professionnelle 1 algerina

  # Classi Wikidata per riconoscere una squadra NAZIONALE (verificate):
  # Q6979593 "squadra nazionale di calcio", Q1194951 "squadra sportiva
  # nazionale" (la superclasse). Costanti strutturali, non pesi da tarare.
  classi_nazionale: ["Q6979593", "Q1194951"]
  classe_riserve: "Q2412834"         # "squadra riserve" (gia' usata dal Layer A)

  # Bande di selezione nazionale. eta_banda = eta' nominale della selezione:
  # serve a misurare la PRECOCITA' della convocazione. Un 17enne in U17 e'
  # normale per un talento; un 17enne in U20 e' un fatto raro, e il punteggio
  # deve saperlo distinguere.
  selezioni:
    senior: {peso: 1.00, eta_banda: 26.0}
    U23:    {peso: 0.85, eta_banda: 22.0}
    U21:    {peso: 0.80, eta_banda: 20.0}
    U20:    {peso: 0.72, eta_banda: 19.0}
    U19:    {peso: 0.62, eta_banda: 18.0}
    U18:    {peso: 0.55, eta_banda: 17.0}
    U17:    {peso: 0.48, eta_banda: 16.0}
    U16:    {peso: 0.38, eta_banda: 15.0}
    # U15/U14 aggiunte dopo la prova live: nei dati veri di Wikidata compaiono
    # davvero selezioni "under-15" (viste su nazionali giovanili tedesche e
    # danesi). Senza queste voci una U15 sarebbe ricaduta sulla banda di
    # ripiego U16, cioe' sarebbe stata SOPRAVVALUTATA - l'esatto contrario
    # della regola "nel dubbio non si gonfia". Un ripiego prudente lo e' solo
    # rispetto a cio' che esiste davvero nella fonte.
    U15:    {peso: 0.30, eta_banda: 14.0}
    U14:    {peso: 0.24, eta_banda: 13.0}
  # Banda usata quando l'etichetta della selezione non e' interpretabile:
  # si sceglie la PIU' PRUDENTE (mai la piu' generosa), coerente con la
  # regola cardinale - nel dubbio non si gonfia.
  selezione_banda_ignota: U14

  soglie:
    presenze_saturazione: 25       # presenze oltre cui il volume non aggiunge (una stagione da titolare)
    caps_saturazione: 8            # convocazioni oltre cui il volume non aggiunge
    # L'ATTO della selezione vale gia' la maggior parte del segnale: essere
    # scelto e' la scommessa, i minuti che seguono la rifiniscono.
    selezione_base: 0.60
    precocita_spread_anni: 4.0     # su quanti anni sotto il riferimento la precocita' satura
    precocita_minima: 0.25         # minuti veri di un 22enne valgono meno, ma non zero
    traiettoria_finestra_mesi: 24  # un salto verso l'alto conta se recente
    traiettoria_salto_saturazione: 0.35  # salto di peso-livello oltre cui la traiettoria satura (~due bande)
    corroborazione_piena: 3        # scommettitori DISTINTI per dirsi corroborato

  quadranti:
    # Le due soglie che separano i quadranti (vedi evidence_quadrant).
    soglia_validazione: 45         # sopra: il segnale costoso c'e' davvero
    soglia_buzz: 55                # sopra: la stampa se n'e' gia' accorta

  cache:
    # I dati di carriera si muovono a settimane, non a ore: rileggerli a ogni
    # scansione sprecherebbe l'unica risorsa davvero scarsa qui, cioe' la
    # tolleranza di WDQS (misurata durante lo sviluppo: sotto outage scende a
    # 1 richiesta/minuto). La cache e' quindi parte del design, non un
    # optional - e vive nella stessa persistenza append-only del resto.
    validita_giorni: 7
    max_qid_per_query: 120         # QID per singola query VALUES (batch)
    max_query_per_run: 12          # tetto duro: la validazione non fa mai saltare una scansione
    timeout_secondi: 45
